name: CI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    uses: kiongahq/.github/.github/workflows/go.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
  image:
    needs: go
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    permissions: {contents: write, packages: write}
    with: {image: serving-manager}

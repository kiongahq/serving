name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    uses: kiongahq/.github/.github/workflows/go.yml@2517a38a78046eaa6f51afc2dc12a33fc4beb4d7
  image:
    needs: go
    uses: kiongahq/.github/.github/workflows/image.yml@2517a38a78046eaa6f51afc2dc12a33fc4beb4d7
    permissions: {contents: read, packages: write}
    with: {image: serving-manager}

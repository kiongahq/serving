name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    uses: kiongahq/.github/.github/workflows/go.yml@1d0892d30e49997b7a082766e23d15ffb6ed5c1b
  image:
    needs: go
    uses: kiongahq/.github/.github/workflows/image.yml@1d0892d30e49997b7a082766e23d15ffb6ed5c1b
    permissions: {contents: read, packages: write}
    with: {image: serving-manager}
